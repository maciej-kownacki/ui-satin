# CI: types, the npm build, a dry-run pack of what would be published, and the published types
# checked the way apps resolve them. It runs on pull requests and on every push to main (that run is
# the README's badge), and Release calls it on every push to main before Changesets may publish
# (workflow_call), so nothing reaches npm without these checks.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Runtime and accessibility tests (Vitest, jsdom, Testing Library, axe): packages/*/src/__tests__/*.test.tsx.
      - run: npm test
      - run: npm run build:ui
      - run: npm pack ./packages/ui/dist --dry-run
      # Satin Pro builds on Free's dist; it's checked like Free but never published.
      - run: npm run build:pro
      # Neither stylesheet (Free's, Pro's) shares a name with an app's Tailwind or shadcn theme.
      - run: node scripts/check-css.mjs
      - run: node scripts/check-cn.mjs
      # Text 4.5:1, focus and error edges 3:1, in Light and Dark and for themeCss() brands.
      - run: npm run check:contrast
      # Layout properties move only through pixel-motion or an exception MOTION.md names (rule 1).
      - run: npm run check:motion
      # The built themeVars()/themeCss() give a real CSS value for every brand and corner scale.
      - run: node scripts/check-theme.mjs
      # What an app ships for Button, Banner and Dialog with their dependencies, and the stylesheet (.size-limit.json).
      - run: npm run size
      # props.json (the props read from the types, in the registry and the markdown docs) is fresh,
      # and the docs pages, registry items and package entries agree.
      - run: npm run check:docs
      # The shadcn registry says which npm release its source matches; it must be this one.
      - name: Registry version matches the package
        run: node -e "const v=require('./packages/ui/package.json').version, r=require('./satin-lab/public/r/button.json').meta.version; if (v!==r) { console.error('registry meta.version', r, '!= package', v, '- run npm run registry'); process.exit(1) }"
      # Both packages' types under moduleResolution node16, nodenext and bundler, every entry point.
      - run: npm run check:types
      - run: npx -y @arethetypeswrong/cli --pack ./packages/ui/dist --exclude-entrypoints ./styles.css ./tokens.json --ignore-rules cjs-resolves-to-esm
