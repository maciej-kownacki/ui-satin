# CI on pull requests: types, the npm build and a dry-run pack of what would be published.
name: CI

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:ui
      - run: npm pack ./packages/ui/dist --dry-run
