name: Report a problem
description: Something in a component or on uisatin.dev doesn't work or looks wrong.
labels: [bug]
body:
  - type: input
    id: page
    attributes:
      label: Component or page
      description: Filled in when you come from a page on uisatin.dev.
      placeholder: notification
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead. A screenshot helps.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The @uisatin/ui version, if you use the package.
      placeholder: 0.6.0
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Chrome 142, macOS
